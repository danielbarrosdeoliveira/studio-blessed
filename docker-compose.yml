services:
  db:
    image: postgres:16-alpine
    container_name: studio-blessed-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: studio_blessed
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studio -d studio_blessed']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
