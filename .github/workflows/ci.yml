name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Testes, Lint e Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_blessed_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U studio -d studio_blessed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Gerar migrations (dry-run)
        env:
          DATABASE_URL: postgres://studio:studio@localhost:5432/studio_blessed_test
        run: pnpm db:generate

      - name: Testes unitários + integração
        env:
          DATABASE_URL: postgres://studio:studio@localhost:5432/studio_blessed_test
          BETTER_AUTH_SECRET: test-secret-do-not-use-in-production
          BETTER_AUTH_URL: http://localhost:3000
        run: pnpm test
