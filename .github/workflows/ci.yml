name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-build-typecheck:
    name: Lint, Formatação, Typecheck e Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências do projeto
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatação (Prettier)
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build de produção
        run: pnpm build

      - name: Gerar migrations (dry-run)
        env:
          DATABASE_URL: postgres://studio:studio@localhost:5432/studio_blessed_test
        run: pnpm db:generate
