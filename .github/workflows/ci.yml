name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Testes, Lint, Typecheck e Cobertura
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_blessed_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U studio -d studio_blessed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências do projeto
        run: pnpm install --frozen-lockfile

      - name: Instalar dependências do sistema (Playwright)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libgtk-3-0 libpango-1.0-0 libxcomposite1 libxdamage1 libxfixes6 libxkbcommon0 libxrandr2 xvfb

      - name: Instalar navegador Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build de produção
        run: pnpm build

      - name: Gerar migrations (dry-run)
        env:
          DATABASE_URL: postgres://studio:studio@localhost:5432/studio_blessed_test
        run: pnpm db:generate

      - name: Cobertura completa (unit + integração + E2E)
        env:
          DATABASE_URL: postgres://studio:studio@localhost:5432/studio_blessed_test
          BETTER_AUTH_SECRET: test-secret-do-not-use-in-production
          BETTER_AUTH_URL: http://localhost:3000
          NODE_ENV: test
        run: pnpm test:coverage
